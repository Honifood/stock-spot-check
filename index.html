<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E408C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spot Check">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>Honi Poke Stock Spot Check</title>
</head>
<body>
<header class="app-header">
  <div class="brand"><img class="logo-img" src="logo-white.png" alt="Honi Poke" height="22"><span class="app-name">Stock Spot Check</span></div>
  <button id="btn-home" class="btn-ghost" hidden>&larr; Saved</button>
</header>

<div id="update-banner" class="update-banner" hidden><span>A new version is available.</span><button id="btn-update-now">Update now</button></div>
<main id="app">
  <section id="screen-home" class="screen"></section>
  <section id="screen-form" class="screen" hidden></section>
  <section id="screen-done" class="screen" hidden></section>
</main>

<div id="modal" class="modal" hidden><div class="modal-card" id="modal-card"></div></div>
<div id="save-banner" class="save-banner" role="alert" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="common.js"></script>
<script src="pdf.js"></script>
<script src="app.js"></script>
</body>
</html>
